[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofmark-verify"
version = "0.1.0"
description = "ProofMark Verify — Python SDK for the CAPTCHA-replacement protocol (server-side token verification)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["proofmark", "captcha", "verification", "bot-prevention", "recaptcha-alternative", "turnstile-alternative"]
authors = [{ name = "ProofMark" }]
dependencies = []

[project.urls]
Homepage = "https://proofmark.com/verify"

[tool.setuptools.packages.find]
where = ["src"]
